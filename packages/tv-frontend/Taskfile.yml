version: '3'

tasks:
    default:
        desc: List all available tasks
        cmds:
            - task --list
        silent: true

    install:
        desc: Install JS dependencies
        cmds:
            - pnpm install

    lint:
        desc: Run oxlint
        cmds:
            - pnpm lint

    format:
        desc: Format code with Prettier
        cmds:
            - pnpm format

    format:check:
        desc: Check code formatting with Prettier
        cmds:
            - pnpm format:check
